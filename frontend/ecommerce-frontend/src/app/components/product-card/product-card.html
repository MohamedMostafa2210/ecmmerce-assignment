<div class="card">
  <a [routerLink]="['/products', product._id]" class="image-link">
    <img
      [src]="product.images.length ? imageUrl(product.images[0]) : 'https://placehold.co/300x250'"
      [alt]="product.title"
    />

    @if (product.discount) {
      <span class="discount-badge">-{{ product.discount }}%</span>
    }
  </a>

  <div class="content">
    <h3>
      <a [routerLink]="['/products', product._id]">{{ product.title }}</a>
    </h3>

    <p class="desc">
      {{ product.description }}
    </p>

    <div class="price">
      <span class="new"> {{ product.finalPrice }} EGP </span>

      @if (product.discount) {
        <span class="old"> {{ product.price }} EGP </span>
      }
    </div>

    <div class="btn-group">
      <button class="cart-btn" (click)="addToCart()">🛒 Add To Cart</button>

      <button class="wish-btn" (click)="addToWishlist()">❤️ Wishlist</button>
    </div>

    <a [routerLink]="['/products', product._id]" class="view-btn">🔍 View Details</a>

    @if (isAdmin()) {
      <div class="admin-actions">
        <button class="edit-btn" [routerLink]="['/edit-product', product._id]">✏ Edit</button>

        <button class="delete-btn" (click)="deleteProduct()">🗑 Delete</button>
      </div>
    }
  </div>
</div>
