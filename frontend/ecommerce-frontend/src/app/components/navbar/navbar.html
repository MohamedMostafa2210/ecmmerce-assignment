<nav class="navbar">
  <div class="logo">
    <a routerLink="/">KafrDiana</a>
  </div>

  <div class="links">
    <a routerLink="/" routerLinkActive="active">Home</a>

    <a routerLink="/products" routerLinkActive="active"> Products </a>

    <a routerLink="/cart" routerLinkActive="active"> 🛒 Cart </a>

    <a routerLink="/wishlist" routerLinkActive="active"> ❤️ Wishlist </a>

    <a *ngIf="isLoggedIn()" routerLink="/orders" routerLinkActive="active"> 📦 Orders </a>
