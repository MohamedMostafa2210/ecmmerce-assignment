<div class="checkout-container">
  <div class="checkout-header">
    <h2>Checkout</h2>
    <a routerLink="/cart">← Back To Cart</a>
  </div>

  @if (loading) {
    <p>Loading...</p>
  } @else {
    <div class="checkout-grid">
      <div class="form-card">
        <h3>Shipping Information</h3>

        <div class="form-group">
          <label>Select Address</label>

          <select [(ngModel)]="addressId">
            @for (address of addresses; track address._id) {
              <option [value]="address._id">
                {{ address.city }} - {{ address.street }} - Building {{ address.building }}
              </option>
            }
          </select>
        </div>

        <div class="form-group">
          <label>Payment Method</label>

          <select [(ngModel)]="paymentMethod">
            <option value="Cash">Cash</option>
            <option value="Card">Card</option>
          </select>
        </div>

        <div class="form-group">
          <label>Coupon</label>

          <input type="text" [(ngModel)]="coupon" placeholder="Coupon Code" />
        </div>
      </div>

      <div class="summary-card">
        <h3>Order Summary</h3>

        @for (item of cart.products; track item.productId._id) {
          <div class="summary-item">
            <span>{{ item.productId.title }}</span>

            <span>
              {{ item.quantity }}
              ×
              {{ item.productId.finalPrice }}
              EGP
            </span>
          </div>
        }

        <hr />

        <div class="total">
          Total

          <strong>{{ getTotal() }} EGP</strong>
        </div>

        <button class="btn-order" (click)="placeOrder()" [disabled]="submitting">
          {{ submitting ? 'Placing...' : 'Place Order' }}
        </button>
      </div>
    </div>
  }
</div>
